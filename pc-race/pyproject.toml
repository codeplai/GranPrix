[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-race"
version = "0.1.0"
description = "Race Control del GranPrix Delivery Semiautónomo"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "transitions>=0.9",
    "aiomqtt>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
pc-race = "pc_race.main:run"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pc_race*", "contrato*"]

[tool.setuptools.package-data]
pc_race = ["adaptadores/entrada/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["transitions.*"]
ignore_missing_imports = true
